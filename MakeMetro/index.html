<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakeMetro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toolbar">
        <div class="palette" id="colorPalette" aria-label="색상 선택"></div>

        <div class="field">
            <label for="lineNameInput">호선 이름</label>
            <input id="lineNameInput" type="text" value="1호선" maxlength="12">
        </div>

        <div class="field">
            <label for="stationNameInput">역 이름</label>
            <input id="stationNameInput" type="text" value="역" maxlength="12">
        </div>

        <div class="field">
            <label for="saveSlotSelect">저장 공간</label>
            <select id="saveSlotSelect">
                <option value="1">1번</option>
                <option value="2">2번</option>
                <option value="3">3번</option>
                <option value="4">4번</option>
                <option value="5">5번</option>
            </select>
        </div>

        <div class="mode-group">
            <button class="mode-btn active" data-mode="freehand" type="button">자유선</button>
            <button class="mode-btn" data-mode="straight" type="button">직선</button>
            <button class="mode-btn" data-mode="select" type="button">선택</button>
            <button class="mode-btn" data-mode="station" type="button">역 추가</button>
        </div>

        <button id="newMapBtn" type="button">새 노선도</button>
        <button id="saveMapBtn" type="button">노선도 저장</button>
        <button id="loadMapBtn" type="button">노선도 불러오기</button>
        <button id="trainBtn" type="button">시범 운행</button>
        <button id="deleteBtn" type="button">선택 삭제</button>
    </div>

    <aside class="legend" id="lineLegend" aria-label="호선 이름 안내"></aside>

    <canvas id="drawingCanvas" aria-label="지하철 노선도 그리기 캔버스"></canvas>

    <script src="script.js"></script>
</body>
</html>
